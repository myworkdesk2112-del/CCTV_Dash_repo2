<text x="260" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12" text-anchor="start">Evidence Export</text>
<text x="260" y="124" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" fill="#92400e" text-anchor="start">Section 63-oriented evidence package for downstream legal review</text>
<rect x="260" y="136" width="100" height="16" rx="8" fill="none" stroke="#92400e" stroke-width="1" stroke-dasharray="2 2"/>
<text x="310" y="147" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#92400e" text-anchor="middle">NOT IMPLEMENTED</text>
<text x="260" y="172" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#78350f" text-anchor="start">Since 1 July 2024 electronic evidence in India is governed by Section 63 of the Bharatiya Sakshya</text>
<text x="260" y="187" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#78350f" text-anchor="start">Adhiniyam, which requires a dual-signed certificate (custodian and expert) carrying a cryptographic</text>
<text x="260" y="202" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#78350f" text-anchor="start">hash of the record and a description of how it was produced. Sentinel stores evidence crops with no</text>
<text x="260" y="217" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#78350f" text-anchor="start">hash and does not stamp model or software versions per event, so no such package can honestly be</text>
<text x="260" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#78350f" text-anchor="start">produced yet. Evidence Records shows what is persisted today.</text>
<text x="260" y="261" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="start">REQUIRES</text>
<rect x="260" y="269" width="10" height="10" rx="4" fill="none" stroke="#999" stroke-width="1.2"/>
<text x="276" y="277" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#444" text-anchor="start">SHA-256 computed at write time over the crop and metadata, stored alongside it</text>
<rect x="260" y="287" width="10" height="10" rx="4" fill="none" stroke="#999" stroke-width="1.2"/>
<text x="276" y="295" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#444" text-anchor="start">Model and software version stamped on each event at production time</text>
<rect x="260" y="305" width="10" height="10" rx="4" fill="none" stroke="#999" stroke-width="1.2"/>
<text x="276" y="313" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#444" text-anchor="start">A machine-generated production-method statement</text>
<rect x="260" y="323" width="10" height="10" rx="4" fill="none" stroke="#999" stroke-width="1.2"/>
<text x="276" y="331" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" fill="#444" text-anchor="start">A printable certificate with Part A / Part B signature blocks</text>
<rect x="260" y="359" width="220" height="24" rx="4" fill="#ffffff" stroke="#92400e" stroke-width="1"/>
<text x="270" y="375" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="start">→ Evidence Records</text>
