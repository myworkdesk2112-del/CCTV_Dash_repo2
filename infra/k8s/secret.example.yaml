# DESIGN TARGET — untested, and NOT a real secret file. Replace every
# value below and apply with `kubectl apply -f` only from a local,
# untracked copy — never commit real credentials. See infra/README.md.
#
# Better than a raw Secret at production scale, per
# PRODUCTION_MIGRATION_PLAN.md Phase 7: use External Secrets Operator
# or Sealed Secrets backed by a real secrets manager (Vault/cloud KMS)
# instead of plaintext-base64 Secret objects, which is all a bare
# Kubernetes Secret actually provides (base64 is encoding, not
# encryption). This file exists so the interface is documented, not as
# the recommended real mechanism.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-backend-secrets
  namespace: sentinel
type: Opaque
stringData:
  DATABASE_URL: "postgresql://sentinel:REPLACE_ME@postgres:5432/sentinel"
  SENTINEL_ACCESS_TOKEN: "REPLACE_ME"
  SENTINEL_ACCESS_EMAIL: "REPLACE_ME"
  SENTINEL_ONVIF_USERNAME: "REPLACE_ME"
  SENTINEL_ONVIF_PASSWORD: "REPLACE_ME"
  SENTINEL_SSO_OIDC_ISSUER: "REPLACE_ME"
  SENTINEL_SSO_OIDC_AUDIENCE: "REPLACE_ME"
  SENTINEL_SSO_OIDC_JWKS_URL: "REPLACE_ME"
