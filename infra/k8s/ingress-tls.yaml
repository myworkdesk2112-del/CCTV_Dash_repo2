# DESIGN TARGET — untested. See infra/README.md. Assumes cert-manager
# is installed for automated TLS cert issuance (Let's Encrypt or a
# government-issued CA ClusterIssuer — replace `letsencrypt-prod` with
# whichever the real deployment uses).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-ingress
  namespace: sentinel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - sentinel.example.gov.in
      secretName: sentinel-tls
  rules:
    - host: sentinel.example.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinel-frontend
                port:
                  number: 80
          - path: /(cameras|vehicle|watchlist|alerts|federation|admin|health|auth|live|cases)
            pathType: Prefix
            backend:
              service:
                name: sentinel-backend
                port:
                  number: 8000
